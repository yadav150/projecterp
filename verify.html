<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Admission · Janaki Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #dc3545;
      --success: #28a745;
      --radius: 5px;
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }
    .verify-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 500px;
      padding: 40px 32px;
      text-align: center;
    }
    .verify-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      font-size: 32px;
    }
    .verify-icon.valid { background: #e6f4ea; color: var(--success); }
    .verify-icon.invalid { background: #fde8ea; color: var(--primary); }
    .verify-icon.loading { background: #f1f5f9; color: var(--muted); }
    .verify-title { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    .verify-subtitle { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .detail-grid {
      text-align: left;
      margin: 20px 0;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
    .detail-row .label { color: var(--muted); font-weight: 500; }
    .detail-row .value { font-weight: 600; }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--bg); }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    @media (max-width: 480px) {
      .verify-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="verify-card" id="verify-card">
    <div id="verify-content">
      <!-- Dynamically rendered -->
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    (function() {
      var content = document.getElementById('verify-content');

      function renderState(icon, title, subtitle, details) {
        var html = '<div class="verify-icon ' + icon + '">' +
          (icon === 'valid' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' :
          icon === 'invalid' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' :
          '<div class="spinner"></div>') +
        '</div>' +
        '<div class="verify-title">' + title + '</div>' +
        '<div class="verify-subtitle">' + subtitle + '</div>';

        if (details) {
          html += '<div class="detail-grid">';
          for (var key in details) {
            html += '<div class="detail-row"><span class="label">' + key + '</span><span class="value">' + details[key] + '</span></div>';
          }
          html += '</div>';
        }

        html += '<a href="index.html" class="btn">Return to Academy</a>';
        content.innerHTML = html;
      }

      function getToken() {
        var params = new URLSearchParams(window.location.search);
        return params.get('token');
      }

      var token = getToken();
      if (!token) {
        renderState('invalid', 'Invalid Request', 'No verification token provided.');
        return;
      }

      // Show loading
      renderState('loading', 'Verifying Admission', 'Please wait...');

      var db = firebase.firestore();

      // Query admission by token
      db.collection('admissions')
        .where('token', '==', token)
        .get()
        .then(function(querySnapshot) {
          if (querySnapshot.empty) {
            renderState('invalid', 'Admission Not Found', 'The token does not correspond to any valid admission record.');
            return;
          }

          var doc = querySnapshot.docs[0];
          var data = doc.data();

          renderState('valid', 'Admission Verified', 'This admission record is authentic and active.', {
            'Student Name': data.name || 'N/A',
            'Class': data.class || 'N/A',
            'Roll Number': data.roll || 'N/A',
            'Status': data.status || 'N/A',
            'Date': data.date || 'N/A'
          });
        })
        .catch(function(error) {
          console.error('Verification error:', error);
          renderState('invalid', 'Verification Error', 'Unable to verify the admission at this time. Please try again later.');
        });
    })();
  </script>
</body>
</html>
