<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Admission · Janaki Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* same styles as before – keep */
  </style>
</head>
<body>
  <div class="verify-card" id="verify-card">
    <div id="verify-content"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    (function() {
      var content = document.getElementById('verify-content');

      function renderState(icon, title, subtitle, details) {
        // same rendering as before – reuse the one from previous verify.html
        // ... (copy from earlier version)
      }

      function getToken() {
        return new URLSearchParams(window.location.search).get('token');
      }

      var token = getToken();
      if (!token) {
        renderState('invalid', 'Invalid Request', 'No verification token provided.');
        return;
      }

      renderState('loading', 'Verifying Admission', 'Please wait...');

      var db = firebase.database();

      // Search for token across all admissions
      db.ref('admissions').orderByChild('token').equalTo(token).once('value')
        .then(function(snapshot) {
          if (!snapshot.exists()) {
            renderState('invalid', 'Admission Not Found', 'The token does not correspond to any valid admission record.');
            return;
          }
          // Get the first matching child
          var data;
          snapshot.forEach(function(child) {
            data = child.val();
            data.id = child.key;
            return true; // break loop
          });

          renderState('valid', 'Admission Verified', 'This admission record is authentic and active.', {
            'Student Name': data.name || 'N/A',
            'Class': data.class || 'N/A',
            'Roll Number': data.roll || 'N/A',
            'Status': data.status || 'N/A',
            'Date': data.date || 'N/A'
          });
        })
        .catch(function(error) {
          console.error('Verification error:', error);
          renderState('invalid', 'Verification Error', 'Unable to verify the admission at this time.');
        });
    })();
  </script>
</body>
</html>
