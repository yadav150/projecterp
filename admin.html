<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Janaki Professional Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-2: #334155;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --primary: #dc3545;
      --primary-hover: #b02a37;
      --primary-soft: #fde8ea;
      --radius: 5px;
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .login-brand .logo {
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .login-brand .logo svg { width: 24px; height: 24px; }
    .login-brand .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .login-brand .brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .login-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .login-subtitle { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-row label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
    .form-row .req { color: var(--primary); }
    .input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      background: #fff;
      min-height: 44px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      border: 1px solid transparent;
      background: var(--primary);
      color: #fff;
      min-height: 44px;
      transition: background-color 0.15s, transform 0.05s;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn svg { width: 18px; height: 18px; }
    .login-error {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 12.5px;
      display: none;
      margin-bottom: 16px;
      border-left: 3px solid var(--primary);
    }
    .login-error.show { display: block; }
    .login-footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted-2);
      text-align: center;
    }
    .spinner-sm {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    @media (max-width: 480px) {
      .login-card { padding: 28px 20px; }
      .login-title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="login-card" role="main">
    <div class="login-brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Janaki Professional</div>
        <div class="brand-sub">Academy ERP</div>
      </div>
    </div>

    <h1 class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Sign in to access the administration panel.</p>

    <div class="login-error" id="login-error">Invalid credentials. Please try again.</div>

    <form id="login-form" autocomplete="off">
      <div class="form-row">
        <label>Email Address <span class="req">*</span></label>
        <input class="input" type="email" id="login-email" placeholder="admin@janaki.edu" required />
      </div>
      <div class="form-row">
        <label>Password <span class="req">*</span></label>
        <input class="input" type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button class="btn" type="submit" id="login-btn">
        <span id="login-btn-text">Sign In</span>
        <span id="login-btn-spinner" class="spinner-sm hidden"></span>
      </button>
    </form>

    <div class="login-footer">Janaki Professional Academy &middot; ERP System</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    (function() {
      var form = document.getElementById('login-form');
      var emailInput = document.getElementById('login-email');
      var passwordInput = document.getElementById('login-password');
      var errorEl = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');
      var btnText = document.getElementById('login-btn-text');
      var btnSpinner = document.getElementById('login-btn-spinner');

      function setLoading(state) {
        if (state) {
          btn.disabled = true;
          btnText.textContent = 'Signing in...';
          btnSpinner.classList.remove('hidden');
        } else {
          btn.disabled = false;
          btnText.textContent = 'Sign In';
          btnSpinner.classList.add('hidden');
        }
      }

      function showError(msg) {
        errorEl.textContent = msg || 'Invalid credentials. Please try again.';
        errorEl.classList.add('show');
        setTimeout(function() {
          errorEl.classList.remove('show');
        }, 4000);
      }

      // Check if already logged in
      firebase.auth().onAuthStateChanged(function(user) {
        if (user) {
          window.location.href = 'index.html';
        }
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorEl.classList.remove('show');

        var email = emailInput.value.trim();
        var password = passwordInput.value.trim();

        if (!email || !password) {
          showError('Please enter both email and password.');
          return;
        }

        setLoading(true);

        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(function() {
            // Success – redirect handled by onAuthStateChanged
            window.location.href = 'index.html';
          })
          .catch(function(error) {
            setLoading(false);
            var msg = error.message;
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
              msg = 'Invalid email or password.';
            }
            showError(msg);
          });
      });
    })();
  </script>
</body>
</html>
